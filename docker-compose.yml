services:
  dvwa:
    image: ghcr.io/digininja/dvwa:latest
    environment:
      - DB_SERVER=db
    depends_on:
      - db
    ports:
      - "127.0.0.1:4280:80"   # localhost only, never expose DVWA
    restart: unless-stopped

  attacker:
    build: ./attacker
    depends_on:
      - dvwa
    profiles: ["attack"]   # only starts when you ask for it

  capture:
    build: ./capture
    network_mode: "service:dvwa"
    cap_add:
      - NET_RAW
      - NET_ADMIN
    volumes:
      - ./captures:/captures
    command: ["tcpdump", "-i", "eth0", "-nn", "-U", "-w", "/captures/nmap-scan.pcap"]
    depends_on:
      - dvwa
    profiles: ["capture"]

  db:
    image: mariadb:10
    environment:
      - MYSQL_ROOT_PASSWORD=dvwa
      - MYSQL_DATABASE=dvwa
      - MYSQL_USER=dvwa
      - MYSQL_PASSWORD=p@ssw0rd
    volumes:
      - dvwa-db:/var/lib/mysql
    restart: unless-stopped

  suricata:
    image: jasonish/suricata:latest
    volumes:
      - ./attacks:/pcaps:ro
      - ./rules/suricata:/rules:ro
      - ./output/suricata:/var/log/suricata
    command: ["-v", "-l", "/var/log/suricata", "--runmode", "single", "-r", "/pcaps/nmap-connect-scan.pcap", "-S", "/rules/local.rules", "-k", "none"]
    profiles: ["detect"]

volumes:
  dvwa-db: